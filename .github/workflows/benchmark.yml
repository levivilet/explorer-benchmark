name: Explorer memory benchmark
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'
permissions:
  contents: read
concurrency:
  group: explorer-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cdp
      - run: npm run test:adapters
      - run: npm run test:crash
  benchmark:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        implementation: [lvce, pierre, arborist, headless, jstree]
        files: [10000, 100000, 1000000, 10000000]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Prepare ${{ matrix.files }} synthetic entries
        run: npm run fixture -- --files ${{ matrix.files }}
      - name: Benchmark ${{ matrix.implementation }} with ${{ matrix.files }} files
        env:
          BENCHMARK_COMMIT: ${{ github.sha }}
          BENCHMARK_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run benchmark -- --implementation ${{ matrix.implementation }} --files ${{ matrix.files }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: explorer-shard-${{ matrix.implementation }}-${{ matrix.files }}
          path: results/
          if-no-files-found: error
          retention-days: 90
  report:
    needs: [test, benchmark]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: explorer-shard-*
          path: shards
      - run: npm run merge
      - run: npm run report
      - run: npx playwright install --with-deps chromium
      - run: npm run test:report
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: explorer-benchmark-${{ github.run_id }}
          path: |
            results/
            .tmp/pages/
          include-hidden-files: true
          retention-days: 90
      - name: Require all validation and benchmark jobs
        if: needs.test.result != 'success' || needs.benchmark.result != 'success'
        run: exit 1
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .tmp/pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: report
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
